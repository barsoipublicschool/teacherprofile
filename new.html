<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Faculty Directory</title>

  <style>
    :root {
      --primary: #1e3a27;
      --primary-light: #2d5a3c;
      --accent: #059669;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #4b5563;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #app-container {
      width: 100%;
      max-width: 900px;
    }

    /* Loader */
    .loader {
      text-align: center;
      padding: 50px 20px;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    /* ================= DIRECTORY LIST STYLES ================= */
    .directory-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 24px 20px;
      border-radius: 12px 12px 0 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .directory-header h1 {
      font-size: 24px;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .directory-header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .teacher-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
      background: #ffffff;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .teacher-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      background: #fafafa;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .teacher-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border-color: var(--accent);
    }

    .teacher-card img {
      width: 110px;
      height: 135px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--primary);
      margin-bottom: 12px;
      background-color: #e5e7eb;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .teacher-card h3 {
      font-size: 16px;
      color: var(--text-main);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .teacher-card p {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-view {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      width: 100%;
      margin-top: auto;
      transition: background 0.2s;
    }

    .btn-view:hover {
      background-color: var(--primary-light);
    }

    /* ================= NEW MODERN PROFILE CARD STYLES ================= */
    .nav-bar {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-back {
      background-color: #374151;
      color: white;
    }
    .btn-back:hover { background-color: #1f2937; }

    .btn-print {
      background-color: var(--accent);
      color: white;
    }
    .btn-print:hover { background-color: #047857; }

    .profile-card {
      background: var(--card-bg);
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    /* Header Banner with RIGHT SIDE Photo */
    .profile-header-banner {
      background: linear-gradient(135deg, var(--primary), #112217);
      color: #ffffff;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .header-text-content {
      max-width: 65%;
    }

    .header-text-content h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .header-text-content p {
      font-size: 14px;
      color: #a7f3d0;
      letter-spacing: 2px;
      margin-top: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* RIGHT SIDE PHOTO CONTAINER */
    .photo-right-container {
      width: 130px;
      height: 155px;
      background: #ffffff;
      padding: 4px;
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
      border: 2px solid #a7f3d0;
      flex-shrink: 0;
    }

    .photo-right-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
      background-color: #e5e7eb;
    }

    /* Profile Main Content */
    .profile-content-grid {
      display: grid;
      grid-template-columns: 32% 68%;
      padding: 25px 30px;
      gap: 25px;
    }

    .sidebar-col {
      border-right: 2px solid #f3f4f6;
      padding-right: 20px;
    }

    .main-col {
      padding-left: 5px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 12px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: #e5e7eb;
    }

    .skills-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      list-style: none;
    }

    .skills-pills li {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
    }

    .block-item {
      margin-bottom: 22px;
    }

    .summary-p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      text-align: justify;
    }

    .formatted-entry {
      margin-bottom: 12px;
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .formatted-entry strong {
      display: block;
      font-weight: 700;
      color: var(--text-main);
      font-size: 13px;
      margin-bottom: 2px;
    }

    /* Footer Details */
    .profile-footer-section {
      background-color: #f9fafb;
      border-top: 1px solid #e5e7eb;
      padding: 20px 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .footer-block {
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    /* PRINT SPECIFIC STYLES FOR PDF SAVE */
    @media print {
      body {
        background: none;
        padding: 0;
      }
      #app-container {
        max-width: 100%;
      }
      .nav-bar, .directory-header, #directoryView, .btn-action {
        display: none !important;
      }
      .profile-card {
        box-shadow: none;
        border: none;
      }
    }

    /* Responsive Mobile adjustments */
    @media (max-width: 600px) {
      .profile-header-banner {
        padding: 20px;
      }
      .header-text-content h1 {
        font-size: 22px;
      }
      .photo-right-container {
        width: 100px;
        height: 125px;
      }
      .profile-content-grid {
        grid-template-columns: 1fr;
        padding: 20px;
        gap: 15px;
      }
      .sidebar-col {
        border-right: none;
        border-bottom: 2px solid #f3f4f6;
        padding-right: 0;
        padding-bottom: 15px;
      }
      .profile-footer-section {
        grid-template-columns: 1fr;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<div id="app-container">
  
  <div id="loader" class="loader">Loading Faculty Directory...</div>

  <!-- VIEW 1: DIRECTORY LIST -->
  <div id="directoryView" style="display: none;">
    <div class="directory-header">
      <h1>School Faculty Directory</h1>
      <p>Select a teacher to view complete profile</p>
    </div>
    <div class="teacher-grid" id="teacherGrid"></div>
  </div>

  <!-- VIEW 2: NEW PROFESSIONAL PROFILE CARD (RIGHT SIDE PHOTO & ACTION BUTTONS) -->
  <div id="profileView" style="display: none;">
    
    <div class="nav-bar">
      <button class="btn-action btn-back" onclick="showDirectory()">✕ Close Profile</button>
      <button class="btn-action btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>

    <div class="profile-card">
      
      <!-- Top Banner with Right Side Photo -->
      <div class="profile-header-banner">
        <div class="header-text-content">
          <h1 id="pName">--</h1>
          <p id="pDesignation">TEACHER</p>
        </div>
        <div class="photo-right-container">
          <img id="pImg" class="photo-right-img" src="" alt="Teacher Photo" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/150'">
        </div>
      </div>

      <!-- Main Body -->
      <div class="profile-content-grid">
        <div class="sidebar-col">
          <h2 class="section-title">SKILLS</h2>
          <ul class="skills-pills" id="pSkills"></ul>
        </div>

        <div class="main-col">
          <div class="block-item">
            <h2 class="section-title">PROFILE SUMMARY</h2>
            <p class="summary-p" id="pSummary"></p>
          </div>

          <div class="block-item">
            <h2 class="section-title">EDUCATION</h2>
            <div id="pEducation"></div>
          </div>

          <div class="block-item">
            <h2 class="section-title">WORK EXPERIENCE</h2>
            <div id="pExperience"></div>
          </div>
        </div>
      </div>

      <!-- Footer Details -->
      <div class="profile-footer-section">
        <div class="footer-block">
          <h2 class="section-title">CONTACT ME</h2>
          <div id="pContact"></div>
        </div>

        <div class="footer-block">
          <h2 class="section-title">REFERENCES</h2>
          <div id="pReference"></div>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
  // Aapki Web App URL set kar di gayi hai
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfgUCFlf9n6aVu3JXhYAdek2E7CajoZz-ZhmyTySbd0BchgZLLjHoe_GEhBdg4Uex4/exec";
  let allTeachersData = [];

  // Google Drive Image URL Converter (Supports file ID and resourcekey)
  function getDirectPhotoUrl(url) {
    if (!url) return "https://via.placeholder.com/150";
    
    let fileId = "";
    const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
    if (idMatch && idMatch[1]) {
      fileId = idMatch[1];
    }

    let resourceKey = "";
    const rkMatch = url.match(/resourcekey=([a-zA-Z0-9_-]+)/);
    if (rkMatch && rkMatch[1]) {
      resourceKey = rkMatch[1];
    }

    if (fileId) {
      let finalUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=s500`;
      if (resourceKey) {
        finalUrl += `&resourcekey=${resourceKey}`;
      }
      return finalUrl;
    }
    return url;
  }

  // Handle Back button on mobile
  window.addEventListener("popstate", function () {
    if (document.getElementById("profileView").style.display === "block") {
      document.getElementById("profileView").style.display = "none";
      document.getElementById("directoryView").style.display = "block";
    }
  });

  window.addEventListener("DOMContentLoaded", () => {
    // 1. Superfast Local Cache Instant Load
    try {
      const cachedData = localStorage.getItem("cached_faculty_data");
      if (cachedData) {
        allTeachersData = JSON.parse(cachedData);
        renderDirectory(allTeachersData);
        showMainDirectoryView();
      }
    } catch(e) {}

    // 2. Fetch fresh data from Apps Script
    fetchData();
  });

  function fetchData() {
    fetch(SCRIPT_URL, { method: "GET", redirect: "follow" })
      .then(res => res.json())
      .then(res => {
        if (res && res.status === "success" && res.data && res.data.length > 0) {
          allTeachersData = res.data;
          try {
            localStorage.setItem("cached_faculty_data", JSON.stringify(res.data));
          } catch(e) {}
          renderDirectory(allTeachersData);
          showMainDirectoryView();
        } else if (!allTeachersData.length) {
          document.getElementById("loader").innerText = "No Teacher Data Found!";
        }
      })
      .catch(err => {
        console.error(err);
        if (!allTeachersData.length) {
          document.getElementById("loader").innerText = "Connection Error. Please check internet connection.";
        }
      });
  }

  function showMainDirectoryView() {
    document.getElementById("loader").style.display = "none";
    document.getElementById("directoryView").style.display = "block";
  }

  function renderDirectory(teachers) {
    const grid = document.getElementById("teacherGrid");
    grid.innerHTML = "";

    teachers.forEach((t) => {
      const card = document.createElement("div");
      card.className = "teacher-card";
      
      const photo = getDirectPhotoUrl(t["Photo_url"]);
      const name = t["Teacher Name"] || "Unknown";
      const des = t["Designation"] || "TEACHER";

      card.innerHTML = `
        <img src="${photo}" alt="${name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/150'">
        <h3>${name}</h3>
        <p>${des}</p>
        <button class="btn-view" onclick="openProfile(${t.id})">View Profile</button>
      `;
      grid.appendChild(card);
    });
  }

  function openProfile(id) {
    const teacher = allTeachersData.find(t => t.id === id);
    if (!teacher) return;

    document.getElementById("pName").innerText = teacher["Teacher Name"] || "";
    document.getElementById("pDesignation").innerText = teacher["Designation"] || "TEACHER";
    document.getElementById("pImg").src = getDirectPhotoUrl(teacher["Photo_url"]);
    document.getElementById("pSummary").innerText = teacher["Profile Summary"] || "";

    const skillsList = document.getElementById("pSkills");
    skillsList.innerHTML = "";
    if (teacher["Skills"]) {
      const skillsArr = String(teacher["Skills"]).split(/,|\n/);
      skillsArr.forEach(s => {
        if (s.trim()) {
          const li = document.createElement("li");
          li.innerText = s.trim();
          skillsList.appendChild(li);
        }
      });
    }

    renderFormattedBlock(teacher["Education"], "pEducation");
    renderFormattedBlock(teacher["Work Experience"], "pExperience");

    const contactBox = document.getElementById("pContact");
    contactBox.innerHTML = "";
    if (teacher["Contact Me"]) {
      String(teacher["Contact Me"]).split("\n").forEach(l => {
        if (l.trim()) {
          const p = document.createElement("p");
          p.innerText = l.trim();
          contactBox.appendChild(p);
        }
      });
    }

    const refBox = document.getElementById("pReference");
    refBox.innerHTML = "";
    if (teacher["Reference"]) {
      String(teacher["Reference"]).split("\n").forEach((l, idx) => {
        if (l.trim()) {
          const p = document.createElement("p");
          p.innerText = l.trim();
          if (idx === 0) p.style.fontWeight = "bold";
          refBox.appendChild(p);
        }
      });
    }

    document.getElementById("directoryView").style.display = "none";
    document.getElementById("profileView").style.display = "block";

    try {
      window.history.pushState({ page: 'profile' }, 'Profile');
    } catch(e){}
    
    window.scrollTo(0, 0);
  }

  function showDirectory() {
    document.getElementById("profileView").style.display = "none";
    document.getElementById("directoryView").style.display = "block";
  }

  function renderFormattedBlock(rawText, targetId) {
    const container = document.getElementById(targetId);
    container.innerHTML = "";
    if (!rawText) return;

    const blocks = String(rawText).split("\n\n");
    blocks.forEach(block => {
      const lines = block.split("\n").filter(l => l.trim() !== "");
      if (lines.length > 0) {
        const div = document.createElement("div");
        div.className = "formatted-entry";
        let html = `<strong>${lines[0].trim()}</strong>`;
        for (let i = 1; i < lines.length; i++) {
          html += `<div>${lines[i].trim()}</div>`;
        }
        div.innerHTML = html;
        container.appendChild(div);
      }
    });
  }
</script>

</body>
</html>
