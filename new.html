<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Directory & Resume</title>

  <style>
    :root {
      --header-bg: #4a3b32;
      --sub-header-bg: #2b1f18;
      --sidebar-bg: #7d6e65;
      --text-dark: #222222;
      --text-light: #ffffff;
      --accent-triangle: #2b1f18;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: #e5e5e5;
      color: var(--text-dark);
      padding: 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #app-container {
      width: 100%;
      max-width: 850px;
    }

    /* Loader */
    .loader {
      text-align: center;
      padding: 50px 20px;
      font-size: 16px;
      font-weight: 700;
      color: var(--header-bg);
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* DIRECTORY GRID VIEW */
    .directory-header {
      background: var(--header-bg);
      color: white;
      padding: 20px;
      border-radius: 8px 8px 0 0;
      text-align: center;
    }

    .directory-header h1 {
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .teacher-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
      background: #ffffff;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .teacher-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      background: #fafafa;
    }

    .teacher-card img {
      width: 100px;
      height: 125px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .teacher-card h3 {
      font-size: 15px;
      color: var(--header-bg);
      margin-bottom: 4px;
    }

    .teacher-card p {
      font-size: 11px;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .btn-view {
      background-color: var(--header-bg);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      width: 100%;
    }

    /* ================= EXACT RESUME DESIGN ================= */
    .resume-wrapper {
      background: #ffffff;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 70px;
    }

    /* HEADER SECTION */
    .resume-header {
      display: flex;
      position: relative;
      background: #ffffff;
      min-height: 180px;
    }

    .header-left-title {
      width: 60%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 2;
    }

    .name-box {
      background-color: var(--header-bg);
      color: #ffffff;
      padding: 25px 20px 15px 30px;
    }

    .name-box h1 {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .desig-box {
      background-color: var(--sub-header-bg);
      color: #ffffff;
      padding: 12px 20px 12px 30px;
    }

    .desig-box h2 {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* RIGHT PHOTO OVERLAY WITH CURVED BACKGROUND */
    .header-right-photo {
      width: 40%;
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      background: #ffffff;
    }

    .curved-bg-shape {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: var(--sidebar-bg);
      border-bottom-left-radius: 100%;
      z-index: 1;
    }

    .photo-frame-circle {
      position: relative;
      z-index: 3;
      width: 170px;
      height: 210px;
      margin-top: 10px;
      margin-right: 20px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      overflow: hidden;
      border: 4px solid #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      background-color: #ddd;
    }

    .photo-frame-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* RESUME MAIN CONTENT (2 COLUMNS) */
    .resume-body {
      display: flex;
      min-height: 600px;
    }

    /* LEFT MAIN COLUMN */
    .left-main-col {
      width: 60%;
      padding: 30px 25px 30px 30px;
      background: #ffffff;
    }

    /* RIGHT SIDEBAR COLUMN */
    .right-sidebar-col {
      width: 40%;
      background-color: var(--sidebar-bg);
      color: var(--text-light);
      padding: 30px 20px 30px 25px;
    }

    /* TYPOGRAPHY & SECTION HEADINGS */
    .section-heading-left {
      font-size: 16px;
      font-weight: 800;
      color: #000000;
      text-transform: uppercase;
      margin-top: 15px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-heading-left::before {
      content: '►';
      font-size: 12px;
      color: var(--accent-triangle);
    }

    .dashed-line {
      border-bottom: 1.5px dashed #000000;
      margin-bottom: 12px;
      width: 100%;
    }

    .section-heading-right {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      margin-top: 15px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .dashed-line-white {
      border-bottom: 1.5px dashed #ffffff;
      margin-bottom: 12px;
      width: 100%;
      opacity: 0.8;
    }

    /* CONTENT STYLES */
    .content-block {
      margin-bottom: 20px;
    }

    .about-text {
      font-size: 12px;
      color: #333333;
      line-height: 1.5;
      text-align: justify;
    }

    .formatted-entry {
      margin-bottom: 12px;
      font-size: 12px;
      color: #333333;
      line-height: 1.4;
    }

    .formatted-entry strong {
      display: block;
      font-size: 13px;
      color: #000000;
      font-weight: 700;
      margin-bottom: 2px;
    }

    /* RIGHT SIDEBAR CONTENT */
    .sidebar-list {
      list-style-type: disc;
      padding-left: 18px;
      font-size: 12px;
      line-height: 1.6;
      color: #ffffff;
    }

    .sidebar-list li {
      margin-bottom: 4px;
    }

    .contact-item {
      font-size: 12px;
      color: #ffffff;
      line-height: 1.8;
      margin-bottom: 4px;
      word-break: break-all;
    }

    /* RESUME BOTTOM ACCENT FOOTER */
    .resume-bottom-bar {
      height: 25px;
      background-color: var(--sub-header-bg);
      width: 100%;
    }

    /* ACTION BUTTONS BAR AT BOTTOM */
    .action-toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(30, 30, 30, 0.95);
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      z-index: 9999;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
    }

    .btn-act {
      border: none;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-act-print {
      background-color: #2563eb;
      color: white;
    }

    .btn-act-close {
      background-color: #dc2626;
      color: white;
    }

    /* PRINT RULES FOR PDF EXPORT */
    @media print {
      body {
        background: none;
        padding: 0;
      }
      #app-container {
        max-width: 100%;
      }
      .action-toolbar, #directoryView, .directory-header {
        display: none !important;
      }
      .resume-wrapper {
        box-shadow: none;
        margin-bottom: 0;
      }
    }

    @media (max-width: 650px) {
      .resume-header {
        flex-direction: column-reverse;
      }
      .header-left-title, .header-right-photo {
        width: 100%;
      }
      .header-right-photo {
        justify-content: center;
        padding-top: 15px;
      }
      .photo-frame-circle {
        margin-right: 0;
      }
      .resume-body {
        flex-direction: column;
      }
      .left-main-col, .right-sidebar-col {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div id="app-container">
  
  <div id="loader" class="loader">Loading Faculty Data...</div>

  <!-- VIEW 1: DIRECTORY -->
  <div id="directoryView" style="display: none;">
    <div class="directory-header">
      <h1>Faculty Directory</h1>
    </div>
    <div class="teacher-grid" id="teacherGrid"></div>
  </div>

  <!-- VIEW 2: EXACT REFERENCE DESIGN RESUME VIEW -->
  <div id="profileView" style="display: none;">

    <div class="resume-wrapper" id="printArea">
      
      <!-- Top Header -->
      <div class="resume-header">
        <div class="header-left-title">
          <div class="name-box">
            <h1 id="pName">ADELINE PALMERSTON</h1>
          </div>
          <div class="desig-box">
            <h2 id="pDesignation">ENGLISH TEACHER</h2>
          </div>
        </div>

        <div class="header-right-photo">
          <div class="curved-bg-shape"></div>
          <div class="photo-frame-circle">
            <img id="pImg" src="" alt="Photo" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/150'">
          </div>
        </div>
      </div>

      <!-- Main Body (2 Columns) -->
      <div class="resume-body">
        
        <!-- Left Main Column -->
        <div class="left-main-col">
          <div class="content-block">
            <div class="section-heading-left">ABOUT ME</div>
            <div class="dashed-line"></div>
            <p class="about-text" id="pSummary"></p>
          </div>

          <div class="content-block">
            <div class="section-heading-left">EXPERIENCE</div>
            <div class="dashed-line"></div>
            <div id="pExperience"></div>
          </div>

          <div class="content-block">
            <div class="section-heading-left">EDUCATION</div>
            <div class="dashed-line"></div>
            <div id="pEducation"></div>
          </div>
        </div>

        <!-- Right Sidebar Column -->
        <div class="right-sidebar-col">
          <div class="content-block">
            <div class="section-heading-right">CONTACT</div>
            <div class="dashed-line-white"></div>
            <div id="pContact"></div>
          </div>

          <div class="content-block">
            <div class="section-heading-right">SKILLS</div>
            <div class="dashed-line-white"></div>
            <ul class="sidebar-list" id="pSkills"></ul>
          </div>

          <div class="content-block">
            <div class="section-heading-right">REFERENCES</div>
            <div class="dashed-line-white"></div>
            <div id="pReference" class="contact-item"></div>
          </div>
        </div>

      </div>

      <div class="resume-bottom-bar"></div>
    </div>

    <!-- Bottom Floating Toolbar for Webview & PDF -->
    <div class="action-toolbar">
      <button class="btn-act btn-act-print" onclick="printProfile()">🖨️ Print / Save PDF</button>
      <button class="btn-act btn-act-close" onclick="showDirectory()">✕ Close</button>
    </div>

  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfgUCFlf9n6aVu3JXhYAdek2E7CajoZz-ZhmyTySbd0BchgZLLjHoe_GEhBdg4Uex4/exec";
  let allTeachersData = [];

  // Google Drive Direct Thumbnail Parser
  function getDirectPhotoUrl(url) {
    if (!url) return "https://via.placeholder.com/150";
    
    let fileId = "";
    const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
    if (idMatch && idMatch[1]) {
      fileId = idMatch[1];
    }

    let resourceKey = "";
    const rkMatch = url.match(/resourcekey=([a-zA-Z0-9_-]+)/);
    if (rkMatch && rkMatch[1]) {
      resourceKey = rkMatch[1];
    }

    if (fileId) {
      let finalUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=s500`;
      if (resourceKey) {
        finalUrl += `&resourcekey=${resourceKey}`;
      }
      return finalUrl;
    }
    return url;
  }

  // Native Android Webview Print Bridge Trigger
  function printProfile() {
    if (typeof Android !== "undefined" && Android.print) {
      Android.print(); // Sketchware Android Native Print Call
    } else {
      window.print();  // Standard Browser Fallback
    }
  }

  window.addEventListener("DOMContentLoaded", () => {
    try {
      const cachedData = localStorage.getItem("cached_faculty_data");
      if (cachedData) {
        allTeachersData = JSON.parse(cachedData);
        renderDirectory(allTeachersData);
        showMainDirectoryView();
      }
    } catch(e) {}

    fetchData();
  });

  function fetchData() {
    fetch(SCRIPT_URL, { method: "GET", redirect: "follow" })
      .then(res => res.json())
      .then(res => {
        if (res && res.status === "success" && res.data && res.data.length > 0) {
          allTeachersData = res.data;
          try {
            localStorage.setItem("cached_faculty_data", JSON.stringify(res.data));
          } catch(e) {}
          renderDirectory(allTeachersData);
          showMainDirectoryView();
        } else if (!allTeachersData.length) {
          document.getElementById("loader").innerText = "No Data Found!";
        }
      })
      .catch(err => {
        console.error(err);
        if (!allTeachersData.length) {
          document.getElementById("loader").innerText = "Connection Error!";
        }
      });
  }

  function showMainDirectoryView() {
    document.getElementById("loader").style.display = "none";
    document.getElementById("directoryView").style.display = "block";
  }

  function renderDirectory(teachers) {
    const grid = document.getElementById("teacherGrid");
    grid.innerHTML = "";

    teachers.forEach((t) => {
      const card = document.createElement("div");
      card.className = "teacher-card";
      
      const photo = getDirectPhotoUrl(t["Photo_url"]);
      const name = t["Teacher Name"] || "Unknown";
      const des = t["Designation"] || "TEACHER";

      card.innerHTML = `
        <img src="${photo}" alt="${name}" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/150'">
        <h3>${name}</h3>
        <p>${des}</p>
        <button class="btn-view" onclick="openProfile(${t.id})">View Profile</button>
      `;
      grid.appendChild(card);
    });
  }

  function openProfile(id) {
    const teacher = allTeachersData.find(t => t.id === id);
    if (!teacher) return;

    document.getElementById("pName").innerText = teacher["Teacher Name"] || "";
    document.getElementById("pDesignation").innerText = teacher["Designation"] || "TEACHER";
    document.getElementById("pImg").src = getDirectPhotoUrl(teacher["Photo_url"]);
    document.getElementById("pSummary").innerText = teacher["Profile Summary"] || "";

    // Skills List
    const skillsList = document.getElementById("pSkills");
    skillsList.innerHTML = "";
    if (teacher["Skills"]) {
      const skillsArr = String(teacher["Skills"]).split(/,|\n/);
      skillsArr.forEach(s => {
        if (s.trim()) {
          const li = document.createElement("li");
          li.innerText = s.trim();
          skillsList.appendChild(li);
        }
      });
    }

    renderFormattedBlock(teacher["Work Experience"], "pExperience");
    renderFormattedBlock(teacher["Education"], "pEducation");

    // Contact Info
    const contactBox = document.getElementById("pContact");
    contactBox.innerHTML = "";
    if (teacher["Contact Me"]) {
      String(teacher["Contact Me"]).split("\n").forEach(l => {
        if (l.trim()) {
          const div = document.createElement("div");
          div.className = "contact-item";
          div.innerText = l.trim();
          contactBox.appendChild(div);
        }
      });
    }

    // References
    const refBox = document.getElementById("pReference");
    refBox.innerHTML = "";
    if (teacher["Reference"]) {
      String(teacher["Reference"]).split("\n").forEach(l => {
        if (l.trim()) {
          const div = document.createElement("div");
          div.innerText = l.trim();
          refBox.appendChild(div);
        }
      });
    }

    document.getElementById("directoryView").style.display = "none";
    document.getElementById("profileView").style.display = "block";
    window.scrollTo(0, 0);
  }

  function showDirectory() {
    document.getElementById("profileView").style.display = "none";
    document.getElementById("directoryView").style.display = "block";
  }

  function renderFormattedBlock(rawText, targetId) {
    const container = document.getElementById(targetId);
    container.innerHTML = "";
    if (!rawText) return;

    const blocks = String(rawText).split("\n\n");
    blocks.forEach(block => {
      const lines = block.split("\n").filter(l => l.trim() !== "");
      if (lines.length > 0) {
        const div = document.createElement("div");
        div.className = "formatted-entry";
        let html = `<strong>${lines[0].trim()}</strong>`;
        for (let i = 1; i < lines.length; i++) {
          html += `<div>• ${lines[i].trim()}</div>`;
        }
        div.innerHTML = html;
        container.appendChild(div);
      }
    });
  }
</script>

</body>
</html>
