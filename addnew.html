<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Teacher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #f3f4f6; padding: 20px; display: flex; justify-content: center; }
    .form-card {
      background: white; width: 100%; max-width: 600px; padding: 25px;
      border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 { color: #2d5a27; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 5px; }
    input, textarea {
      width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 5px;
      font-size: 14px; outline: none;
    }
    input:focus, textarea:focus { border-color: #2d5a27; }
    textarea { height: 70px; resize: vertical; }
    button {
      width: 100%; background: #2d5a27; color: white; border: none; padding: 12px;
      font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer;
    }
    button:hover { background: #1e3d1a; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

<div class="form-card">
  <h2>Add Teacher Details</h2>
  <form id="teacherForm">
    <div class="form-group">
      <label>Teacher Name *</label>
      <input type="text" id="teacherName" required>
    </div>
    <div class="form-group">
      <label>Designation *</label>
      <input type="text" id="designation" placeholder="e.g. SCIENCE TEACHER" required>
    </div>
    <div class="form-group">
      <label>Skills (Comma separated)</label>
      <input type="text" id="skills" placeholder="e.g. Teaching Planning, Creativity">
    </div>
    <div class="form-group">
      <label>Profile Summary</label>
      <textarea id="profileSummary"></textarea>
    </div>
    <div class="form-group">
      <label>Education</label>
      <textarea id="education" placeholder="e.g. MSc. Zoology&#10;BEd."></textarea>
    </div>
    <div class="form-group">
      <label>Work Experience</label>
      <textarea id="workExperience" placeholder="e.g. 5 years experience"></textarea>
    </div>
    <div class="form-group">
      <label>Contact Me (Phone / Email)</label>
      <textarea id="contactMe"></textarea>
    </div>
    <div class="form-group">
      <label>Reference</label>
      <textarea id="reference"></textarea>
    </div>
    <div class="form-group">
      <label>Google Drive Photo URL *</label>
      <input type="url" id="photoUrl" placeholder="https://drive.google.com/file/d/..." required>
    </div>
    <button type="submit" id="subBtn">Submit Details</button>
  </form>
  <div id="status"></div>
</div>

<script>
  // Yahan apna deployed Apps Script Exec URL daalein
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfgUCFlf9n6aVu3JXhYAdek2E7CajoZz-ZhmyTySbd0BchgZLLjHoe_GEhBdg4Uex4/exec";

  document.getElementById("teacherForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn = document.getElementById("subBtn");
    const status = document.getElementById("status");

    btn.disabled = true;
    btn.innerText = "Submitting...";
    status.innerText = "";

    const payload = {
      teacherName: document.getElementById("teacherName").value,
      designation: document.getElementById("designation").value,
      skills: document.getElementById("skills").value,
      profileSummary: document.getElementById("profileSummary").value,
      education: document.getElementById("education").value,
      workExperience: document.getElementById("workExperience").value,
      contactMe: document.getElementById("contactMe").value,
      reference: document.getElementById("reference").value,
      photoUrl: document.getElementById("photoUrl").value
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if(res.status === "success") {
        status.style.color = "green";
        status.innerText = "Teacher details added successfully!";
        document.getElementById("teacherForm").reset();
      } else {
        status.style.color = "red";
        status.innerText = "Error: " + res.message;
      }
    })
    .catch(err => {
      status.style.color = "red";
      status.innerText = "Failed to submit. Please try again.";
      console.error(err);
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerText = "Submit Details";
    });
  });
</script>

</body>
</html>
