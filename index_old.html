<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Teachers Directory</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    }

    body {
      background-color: #e5e7eb;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    #app-container {
      width: 100%;
      max-width: 800px;
    }

    /* Loader */
    .loader {
      text-align: center;
      padding: 50px;
      font-size: 18px;
      font-weight: bold;
      color: #374151;
    }

    /* ================= LIST VIEW STYLES ================= */
    .directory-header {
      background-color: #426944;
      color: white;
      padding: 20px;
      border-radius: 8px 8px 0 0;
      text-align: center;
    }

    .directory-header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .teacher-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
      background: #ffffff;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .teacher-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      background: #fafafa;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .teacher-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .teacher-card img {
      width: 110px;
      height: 130px;
      object-fit: cover;
      border-radius: 4px;
      border: 2px solid #426944;
      margin-bottom: 10px;
      background-color: #ddd;
    }

    .teacher-card h3 {
      font-size: 16px;
      color: #111827;
      margin-bottom: 4px;
    }

    .teacher-card p {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .btn-view {
      background-color: #426944;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      width: 100%;
    }

    .btn-view:hover {
      background-color: #325034;
    }

    /* ================= PROFILE VIEW STYLES ================= */
    .nav-bar {
      margin-bottom: 15px;
    }

    .btn-back {
      background-color: #374151;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .resume-card {
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }

    /* Header Banner */
    .top-banner {
      background-color: #426944;
      color: #ffffff;
      padding: 25px 20px 20px 190px;
      min-height: 120px;
    }

    .top-banner h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }

    .top-banner p {
      font-size: 16px;
      letter-spacing: 2px;
      margin-top: 5px;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* Floating Image */
    .photo-frame {
      position: absolute;
      top: 15px;
      left: 20px;
      width: 145px;
      height: 175px;
      background: #ffffff;
      padding: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 5;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: #eee;
    }

    /* Main Body Flexbox (Responsive) */
    .profile-body {
      display: flex;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .left-col {
      width: 32%;
      padding: 20px 15px 20px 20px;
      border-right: 25px solid #426944;
    }

    .right-col {
      width: 68%;
      padding: 20px 25px;
    }

    h2.heading {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #000000;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .skills-list {
      list-style-type: disc;
      padding-left: 15px;
      font-size: 12px;
      color: #222;
      line-height: 1.6;
      font-weight: 600;
    }

    .block {
      margin-bottom: 22px;
    }

    .summary-text {
      font-size: 12px;
      color: #333;
      line-height: 1.5;
      text-align: justify;
    }

    .entry-item {
      margin-bottom: 12px;
      font-size: 12px;
      color: #333;
      line-height: 1.4;
    }

    .entry-item strong {
      display: block;
      font-weight: bold;
      font-style: italic;
      color: #000;
      font-size: 12.5px;
    }

    .footer-line {
      border-top: 1px solid #ccc;
      margin: 10px 20px 0 20px;
    }

    .footer-wrapper {
      display: flex;
      padding: 15px 20px 25px 20px;
      flex-wrap: wrap;
    }

    .footer-col {
      width: 50%;
      font-size: 12px;
      line-height: 1.6;
      color: #333;
    }

    /* ================= MOBILE RESPONSIVE FIX ================= */
    @media (max-width: 650px) {
      .top-banner {
        padding: 15px 15px 15px 15px;
        text-align: center;
      }

      .photo-frame {
        position: relative;
        top: 0;
        left: 0;
        margin: 15px auto 0 auto;
        width: 140px;
        height: 165px;
      }

      .profile-body {
        margin-top: 15px;
        flex-direction: column;
      }

      .left-col {
        width: 100%;
        border-right: none;
        border-bottom: 8px solid #426944;
        padding: 15px 20px;
      }

      .right-col {
        width: 100%;
        padding: 20px;
      }

      .footer-col {
        width: 100%;
        margin-bottom: 15px;
      }
    }
  </style>
</head>
<body>

<div id="app-container">
  
  <div id="loader" class="loader">Loading Teachers Directory...</div>

  <!-- VIEW 1: TEACHER LIST DIRECTORY -->
  <div id="directoryView" style="display: none;">
    <div class="directory-header">
      <h1>School Faculty Directory</h1>
      <p>Select a teacher to view full profile</p>
    </div>
    <div class="teacher-grid" id="teacherGrid"></div>
  </div>

  <!-- VIEW 2: INDIVIDUAL PROFILE CARD -->
  <div id="profileView" style="display: none;">
    <div class="nav-bar">
      <button class="btn-back" onclick="showDirectory()">← Back to Teachers List</button>
    </div>

    <div class="resume-card">
      <div class="photo-frame">
        <img id="pImg" src="" alt="Photo" onerror="this.src='https://via.placeholder.com/150'">
      </div>

      <div class="top-banner">
        <h1 id="pName">--</h1>
        <p id="pDesignation">TEACHER</p>
      </div>

      <div class="profile-body">
        <div class="left-col">
          <h2 class="heading">SKILLS</h2>
          <ul class="skills-list" id="pSkills"></ul>
        </div>

        <div class="right-col">
          <div class="block">
            <h2 class="heading">PROFILE SUMMARY</h2>
            <p class="summary-text" id="pSummary"></p>
          </div>

          <div class="block">
            <h2 class="heading">EDUCATION</h2>
            <div id="pEducation"></div>
          </div>

          <div class="block">
            <h2 class="heading">WORK EXPERIENCE</h2>
            <div id="pExperience"></div>
          </div>
        </div>
      </div>

      <div class="footer-line"></div>

      <div class="footer-wrapper">
        <div class="footer-col">
          <h2 class="heading">CONTACT ME</h2>
          <div id="pContact"></div>
        </div>

        <div class="footer-col">
          <h2 class="heading">REFERENCES</h2>
          <div id="pReference"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  // Apka Google Apps Script Web App URL yahan paste karein
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzflcrRUvs30bfLJB89RRZ6f9Qw1-SckLDtouASVjmFBspz3oYtDqSsIS2LXgeoITsvYQ/exec";
  
  let allTeachersData = [];

  window.addEventListener("DOMContentLoaded", () => {
    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(res => {
        document.getElementById("loader").style.display = "none";
        if (res.status === "success" && res.data.length > 0) {
          allTeachersData = res.data;
          renderDirectory(allTeachersData);
          document.getElementById("directoryView").style.display = "block";
        } else {
          document.getElementById("loader").innerText = "No Teacher Data Found!";
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById("loader").innerText = "Error loading data!";
      });
  });

  // Render Directory Cards List
  function renderDirectory(teachers) {
    const grid = document.getElementById("teacherGrid");
    grid.innerHTML = "";

    teachers.forEach((t) => {
      const card = document.createElement("div");
      card.className = "teacher-card";
      
      const photo = t["Photo_url"] || "https://via.placeholder.com/150";
      const name = t["Teacher Name"] || "Unknown";
      const des = t["Designation"] || "TEACHER";

      card.innerHTML = `
        <img src="${photo}" alt="${name}" onerror="this.src='https://via.placeholder.com/150'">
        <h3>${name}</h3>
        <p>${des}</p>
        <button class="btn-view" onclick="openProfile(${t.id})">View Profile</button>
      `;
      grid.appendChild(card);
    });
  }

  // Open Selected Profile
  function openProfile(id) {
    const teacher = allTeachersData.find(t => t.id === id);
    if (!teacher) return;

    document.getElementById("pName").innerText = teacher["Teacher Name"] || "";
    document.getElementById("pDesignation").innerText = teacher["Designation"] || "TEACHER";
    document.getElementById("pImg").src = teacher["Photo_url"] || "https://via.placeholder.com/150";
    document.getElementById("pSummary").innerText = teacher["Profile Summary"] || "";

    // Skills
    const skillsList = document.getElementById("pSkills");
    skillsList.innerHTML = "";
    if (teacher["Skills"]) {
      const skillsArr = String(teacher["Skills"]).split(/,|\n/);
      skillsArr.forEach(s => {
        if (s.trim()) {
          const li = document.createElement("li");
          li.innerText = s.trim();
          skillsList.appendChild(li);
        }
      });
    }

    // Education & Work Experience
    renderFormattedBlock(teacher["Education"], "pEducation");
    renderFormattedBlock(teacher["Work Experience"], "pExperience");

    // Contact
    const contactBox = document.getElementById("pContact");
    contactBox.innerHTML = "";
    if (teacher["Contact Me"]) {
      String(teacher["Contact Me"]).split("\n").forEach(l => {
        if (l.trim()) {
          const p = document.createElement("p");
          p.innerText = l.trim();
          contactBox.appendChild(p);
        }
      });
    }

    // Reference
    const refBox = document.getElementById("pReference");
    refBox.innerHTML = "";
    if (teacher["Reference"]) {
      String(teacher["Reference"]).split("\n").forEach((l, idx) => {
        if (l.trim()) {
          const p = document.createElement("p");
          p.innerText = l.trim();
          if (idx === 0) p.style.fontWeight = "bold";
          refBox.appendChild(p);
        }
      });
    }

    document.getElementById("directoryView").style.display = "none";
    document.getElementById("profileView").style.display = "block";
    window.scrollTo(0, 0);
  }

  // Back to Directory
  function showDirectory() {
    document.getElementById("profileView").style.display = "none";
    document.getElementById("directoryView").style.display = "block";
  }

  // Helper block renderer
  function renderFormattedBlock(rawText, targetId) {
    const container = document.getElementById(targetId);
    container.innerHTML = "";
    if (!rawText) return;

    const blocks = String(rawText).split("\n\n");
    blocks.forEach(block => {
      const lines = block.split("\n").filter(l => l.trim() !== "");
      if (lines.length > 0) {
        const div = document.createElement("div");
        div.className = "entry-item";
        let html = `<strong>${lines[0].trim()}</strong>`;
        for (let i = 1; i < lines.length; i++) {
          html += `<div>${lines[i].trim()}</div>`;
        }
        div.innerHTML = html;
        container.appendChild(div);
      }
    });
  }
</script>

</body>
</html>
